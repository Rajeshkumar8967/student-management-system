services:

  mongodb:
    image: mongo:7
    container_name: student-management-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: student-management-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - student-network

  frontend:
    build:
      context: ./frontend
    container_name: student-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - student-network

volumes:
  mongodb_data:

networks:
  student-network:
    driver: bridge